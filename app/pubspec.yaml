name: scasi_standalone
description: Standalone Flutter client for Scasi — real Gmail inbox + real Groq-powered AI, no custom backend required.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Auth + Gmail access (native flow, no backend)
  google_sign_in: ^6.2.2
  flutter_secure_storage: ^9.2.2

  # Networking
  http: ^1.2.2

  # Formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
